generated: '2026-08-04'
mitigations:
  bound_glob_complexity:
    description: Cap the number of wildcard segments (and overall length) allowed
      in a component source_paths glob before translating it in glob_to_regex(), and/or
      match with a linear-time engine or a timeout, so a crafted pattern cannot cause
      catastrophic regex backtracking in tmdd review
    references:
    - file: src/utils.py
      lines: 92-127
  bundle_libs_locally:
    description: Bundle Cytoscape.js and dagre libraries locally instead of relying
      on CDN, eliminating the external dependency and enabling fully offline report
      viewing
    references:
    - file: report.py
      lines: 943-945
  confine_reference_paths:
    description: In the lint reference-resolution check, reject absolute reference
      paths and normalize the joined path (resolve/normpath) to verify it stays within
      repo_root before calling .exists(), preventing filesystem probing outside the
      project
    references:
    - file: src/commands/lint.py
      lines: 131-136
  enhanced_safe_json:
    description: Enhance _safe_json() to escape additional dangerous characters beyond
      </ including HTML entities and ensure Content-Type is set correctly for embedded
      JSON data
    references:
    - file: report.py
      lines: 113-114
  git_change_tracking: Rely on Git version control for change tracking and attribution
    of .tmdd/ YAML files; document this requirement in README and generated AGENTS.md
  js_html_escape_helper:
    description: Implement a JavaScript HTML-escape helper function in _DIAGRAM_JS
      and apply it to all threat model values (names, descriptions, labels) before
      inserting into HTML strings
    references:
    - file: report.py
      lines: 572-872
  prompt_delimiters:
    description: Add clear delimiter markers and role boundaries in generated AI prompts
      to reduce the effectiveness of prompt injection from threat model content
    references:
    - file: src/generators/agent_prompt.py
      lines: 17-19
    - file: src/generators/threat_prompt.py
  replace_innerhtml_textcontent:
    description: Replace innerHTML assignments in _DIAGRAM_JS with textContent for
      plain text values, or use DOM createElement/createTextNode for safe HTML construction
    references:
    - file: report.py
      lines: 572-872
  sri_hashes_cdn:
    description: Pin CDN library versions with Subresource Integrity (SRI) hashes
      on all <script> tags in generated HTML to prevent tampered JavaScript from executing
    references:
    - file: report.py
      lines: 943-945
    - file: diagram.py
      lines: 143-145
  validate_git_ref:
    description: Validate the --base value against an allowed git ref-name pattern
      (or resolve it with 'git rev-parse --verify' and separate options from revisions
      using '--') before building the diff range in changed_files_from_git()
    references:
    - file: src/commands/review.py
      lines: 54-63
  validate_report_filename:
    description: Validate the --name output filename in report.py by stripping path
      separators and applying safe_name() or os.path.basename() before joining with
      the output directory, consistent with diagram.py's safe_name() approach
    references:
    - file: report.py
      lines: 1085-1088
  yaml_escape_init_input:
    description: Escape or quote user-provided name/description values before substituting
      into YAML templates during init, using yaml.dump() or proper YAML string quoting
      to prevent structural injection
    references:
    - file: src/commands/init.py
      lines: 36-39
system:
  description: Threat Modeling Driven Development - a Python CLI tool that manages
    YAML-based threat models, validates cross-references, generates AI prompts, and
    produces interactive HTML reports and diagrams
  name: TMDD CLI
  version: 0.5.1
threat_actors:
- description: External attacker who compromises a CDN or npm package used by TMDD-generated
    HTML reports
  id: cdn_package_attacker
- description: Malicious insider with filesystem access who tampers with .tmdd/ YAML
    files to inject harmful content into reports or AI prompts
  id: malicious_insider_fs
- description: Automated CI/CD pipeline that invokes TMDD commands with untrusted
    or user-controlled input parameters
  id: ci_pipeline_untrusted
threats:
  cdn_supply_chain_attack:
    cwe: CWE-829
    description: report.py and diagram.py embed <script> tags loading from unpkg.com
      (cytoscape@3.30.4, dagre@0.8.5, cytoscape-dagre@2.5.0). If unpkg.com is compromised,
      a package is hijacked, or a MITM attack occurs, malicious JavaScript would execute
      in the report viewer's browser with full DOM access to the threat model data.
    name: Supply chain attack via CDN JavaScript dependencies
    severity: high
    stride: T
    suggested_mitigations:
    - sri_hashes_cdn
    - bundle_libs_locally
  glob_redos:
    cwe: CWE-1333
    description: In src/utils.py:92-127, glob_to_regex() translates a component's
      source_paths glob into a regex, mapping each '**' to '.*'. A source_paths value
      crafted with many wildcard segments (e.g. '**a**a**a...') compiles to a regex
      with many chained '.*' groups that exhibits catastrophic/polynomial backtracking
      when matched against long non-matching paths during 'tmdd review' (path_matches_any,
      src/utils.py:135). An attacker able to edit components.yaml can hang the review
      command (denial of service), which is especially relevant when review runs in
      CI over an untrusted branch's threat model.
    name: Regex denial of service via crafted component source_paths glob
    severity: medium
    stride: D
    suggested_mitigations:
    - bound_glob_complexity
  json_script_breakout:
    cwe: CWE-79
    description: In report.py:114, _safe_json() escapes </ to <\/ to prevent script
      tag breakout. However, other injection vectors (e.g., HTML entities, Unicode
      escapes) in threat model strings embedded in the <script type='application/json'>
      block could potentially bypass this single-pattern defense.
    name: Script tag breakout in embedded JSON diagram data
    severity: low
    stride: T
    suggested_mitigations:
    - js_html_escape_helper
    - enhanced_safe_json
  mitigation_reference_path_escape:
    cwe: CWE-22
    description: In src/commands/lint.py:131, the reference-resolution check evaluates
      (repo_root / ref['file']).exists() without confining the path. Because pathlib
      resolves an absolute right-hand side to itself and does not collapse '..', a
      mitigations.yaml reference with an absolute path or '../' sequences is checked
      outside repo_root. The lint output ('file not found' vs silent) then acts as
      an existence oracle for arbitrary filesystem paths. An insider editing mitigations.yaml
      could probe for the presence of files outside the project.
    name: Mitigation reference path escapes repo root during lint
    severity: low
    stride: I
    suggested_mitigations:
    - confine_reference_paths
  no_audit_trail:
    cwe: CWE-778
    description: TMDD stores threat models as plain YAML files with no built-in change
      tracking, signing, or attribution. Anyone with filesystem access can modify
      threats, mitigations, or feature mappings without a trace, undermining the integrity
      of the security assessment.
    name: No audit trail for threat model modifications
    severity: medium
    stride: R
    suggested_mitigations:
    - git_change_tracking
  prompt_injection:
    cwe: CWE-77
    description: In src/generators/agent_prompt.py and threat_prompt.py, threat model
      data (threat names, descriptions, mitigation text) is embedded directly into
      AI prompt text without sanitization. A malicious actor who can edit YAML files
      could inject adversarial instructions into the prompt that alter the AI agent's
      behavior.
    name: Prompt injection via threat model content in generated AI prompts
    severity: medium
    stride: T
    suggested_mitigations:
    - prompt_delimiters
  report_path_traversal:
    cwe: CWE-22
    description: In report.py:1085, the --name argument is joined with the output
      directory via Path(out) / output_name without validation. Unlike diagram.py
      which uses safe_name() for filename generation (line 156), report.py passes
      the raw user input directly, allowing path traversal characters (e.g., ../../malicious.html)
      to write the HTML report outside the intended output directory.
    name: Report output path traversal via --name parameter
    severity: low
    stride: T
    suggested_mitigations:
    - validate_report_filename
  review_git_arg_injection:
    cwe: CWE-88
    description: In src/commands/review.py:57, the user-supplied --base value is interpolated
      into the git revision argument as f'{base}...HEAD' and passed to git diff via
      subprocess.run (no shell, args as a list). The trailing '...HEAD' concatenation
      prevents a crafted --base from forming a clean leading option, so classic argument
      injection is largely blocked, but the ref is still handed to git unvalidated.
      In a CI context that forwards an untrusted PR ref into --base, unexpected revision
      resolution or errors are possible. Residual risk is low given the current suffix
      concatenation.
    name: Argument injection into git subprocess via --base ref
    severity: low
