# =============================================================================
# Components - Building blocks of the TMDD CLI architecture
# =============================================================================
# Identified from actual codebase analysis of src/, diagram.py, report.py
#
# source_paths drive `tmdd review` (changed file -> component). Keep them as
# narrow as the real module boundaries: a component that owns a whole directory
# becomes a hub, and every feature reachable through it lights up on any change.
# =============================================================================

components:
  - id: cli_core
    description: "Argparse-based CLI entry point that parses user commands and dispatches to command handlers (src/cli.py, src/__main__.py)"
    type: service
    technology: "Python / argparse"
    trust_boundary: internal
    source_paths:
      - "src/cli.py"
      - "src/__main__.py"
      - "src/commands/__init__.py"
      - "tests/test_cli.py"

  - id: init_engine
    description: "init command handler: scaffolds a new .tmdd/ project from a bundled template, substituting the user-provided name and description (src/commands/init.py)"
    type: service
    technology: "Python"
    trust_boundary: internal
    source_paths:
      - "src/commands/init.py"
      - "tests/test_cmd_init.py"

  - id: lint_engine
    description: "lint command handler: structural validation and cross-reference integrity checks over the loaded threat model, including mitigation reference resolution (src/commands/lint.py)"
    type: service
    technology: "Python"
    trust_boundary: internal
    source_paths:
      - "src/commands/lint.py"
      - "tests/test_cmd_lint.py"

  - id: feature_engine
    description: "feature command handler: drives the threat-model-first feature workflow and requests prompt generation (src/commands/feature.py)"
    type: service
    technology: "Python"
    trust_boundary: internal
    source_paths:
      - "src/commands/feature.py"
      - "tests/test_cmd_feature.py"

  - id: compile_engine
    description: "compile command handler: assembles the consolidated .tm.yaml and the secure-coding agent prompt from the full model (src/commands/compile.py)"
    type: service
    technology: "Python"
    trust_boundary: internal
    source_paths:
      - "src/commands/compile.py"
      - "tests/test_cmd_compile.py"

  - id: review_engine
    description: "review command handler: maps a code diff to affected threats by matching changed files against component source_paths, and shells out to git for the changed file list (src/commands/review.py)"
    type: service
    technology: "Python / subprocess"
    trust_boundary: internal
    source_paths:
      - "src/commands/review.py"
      - "tests/test_cmd_review.py"

  - id: yaml_processor
    description: "Shared model-loading and path utilities: yaml.safe_load(), threat model assembly, and the glob-to-regex matching used by review (src/utils.py)"
    type: service
    technology: "Python / PyYAML (safe_load)"
    trust_boundary: internal
    source_paths:
      - "src/utils.py"
      - "tests/test_utils.py"

  - id: prompt_generator
    description: "Generates AI prompt text files for threat modeling and secure coding workflows (src/generators/threat_prompt.py, agent_prompt.py)"
    type: service
    technology: "Python"
    trust_boundary: internal
    source_paths:
      - "src/generators/**"
      - "tests/test_generators.py"

  - id: template_store
    description: "Bundled YAML template files (minimal, web-app, api) used by init command for project scaffolding (src/templates/)"
    type: other
    technology: "YAML files"
    trust_boundary: internal
    source_paths:
      - "src/templates/**"

  - id: html_renderer
    description: "Generates interactive HTML reports and architecture diagrams with embedded Cytoscape.js (report.py, diagram.py)"
    type: service
    technology: "Python / HTML / JavaScript"
    trust_boundary: internal
    source_paths:
      - "report.py"
      - "diagram.py"
      - "report_md.py"

  - id: threat_model_store
    description: "The authored .tmdd/ YAML threat model itself - the input every command parses, and the injection vector behind prompt_injection, glob_redos and the stored-XSS threats. Excludes generated artifacts under .tmdd/out/"
    type: other
    technology: "YAML files on local filesystem"
    trust_boundary: internal
    source_paths:
      - ".tmdd/*.yaml"
      - ".tmdd/threats/*.yaml"

  - id: filesystem_store
    description: "Generated artifacts written by TMDD: consolidated .tm.yaml, prompt text files, HTML reports and diagrams (.tmdd/out/)"
    type: other
    technology: "Local filesystem"
    trust_boundary: internal
    # no source_paths: everything under .tmdd/out/ is generated by compile,
    # report and diagram. Reviewing build output would attribute threats to
    # regenerated artifacts rather than to the code or model that produced
    # them. Review the authored inputs (threat_model_store) instead.

  - id: cdn_libraries
    description: "External CDN (unpkg.com) serving Cytoscape.js 3.30.4, dagre 0.8.5, and cytoscape-dagre 2.5.0 loaded client-side in generated HTML"
    type: external
    technology: "unpkg.com CDN / JavaScript"
    trust_boundary: external
    # no source_paths: third-party code, not present in this repo

  - id: git_cli
    description: "External git executable invoked as a subprocess by the review command to list changed files (git diff --name-only). Not bundled with TMDD; resolved from PATH"
    type: external
    technology: "git (external process via subprocess.run)"
    trust_boundary: external
    # no source_paths: external binary resolved from PATH; the calling code
    # lives in review_engine
