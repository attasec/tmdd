$schema: https://tmdd.dev/schema/v0.5
actors:
- description: Developer or security engineer who runs TMDD CLI commands (init, lint,
    feature, compile) and edits .tmdd/ YAML files
  id: developer
- description: AI coding agent that consumes generated prompt files (.tmdd/out/*.prompt.txt,
    *.threatmodel.txt) to produce threat models or secure code
  id: ai_agent
- description: Person viewing generated HTML reports and diagrams in a web browser,
    potentially including non-developers or stakeholders
  id: report_viewer
components:
- description: Argparse-based CLI entry point that parses user commands and dispatches
    to command handlers (src/cli.py, src/__main__.py)
  id: cli_core
  source_paths:
  - src/cli.py
  - src/__main__.py
  - src/commands/__init__.py
  - tests/test_cli.py
  technology: Python / argparse
  trust_boundary: internal
  type: service
- description: 'init command handler: scaffolds a new .tmdd/ project from a bundled
    template, substituting the user-provided name and description (src/commands/init.py)'
  id: init_engine
  source_paths:
  - src/commands/init.py
  - tests/test_cmd_init.py
  technology: Python
  trust_boundary: internal
  type: service
- description: 'lint command handler: structural validation and cross-reference integrity
    checks over the loaded threat model, including mitigation reference resolution
    (src/commands/lint.py)'
  id: lint_engine
  source_paths:
  - src/commands/lint.py
  - tests/test_cmd_lint.py
  technology: Python
  trust_boundary: internal
  type: service
- description: 'feature command handler: drives the threat-model-first feature workflow
    and requests prompt generation (src/commands/feature.py)'
  id: feature_engine
  source_paths:
  - src/commands/feature.py
  - tests/test_cmd_feature.py
  technology: Python
  trust_boundary: internal
  type: service
- description: 'compile command handler: assembles the consolidated .tm.yaml and the
    secure-coding agent prompt from the full model (src/commands/compile.py)'
  id: compile_engine
  source_paths:
  - src/commands/compile.py
  - tests/test_cmd_compile.py
  technology: Python
  trust_boundary: internal
  type: service
- description: 'review command handler: maps a code diff to affected threats by matching
    changed files against component source_paths, and shells out to git for the changed
    file list (src/commands/review.py)'
  id: review_engine
  source_paths:
  - src/commands/review.py
  - tests/test_cmd_review.py
  technology: Python / subprocess
  trust_boundary: internal
  type: service
- description: 'Shared model-loading and path utilities: yaml.safe_load(), threat
    model assembly, and the glob-to-regex matching used by review (src/utils.py)'
  id: yaml_processor
  source_paths:
  - src/utils.py
  - tests/test_utils.py
  technology: Python / PyYAML (safe_load)
  trust_boundary: internal
  type: service
- description: Generates AI prompt text files for threat modeling and secure coding
    workflows (src/generators/threat_prompt.py, agent_prompt.py)
  id: prompt_generator
  source_paths:
  - src/generators/**
  - tests/test_generators.py
  technology: Python
  trust_boundary: internal
  type: service
- description: Bundled YAML template files (minimal, web-app, api) used by init command
    for project scaffolding (src/templates/)
  id: template_store
  source_paths:
  - src/templates/**
  technology: YAML files
  trust_boundary: internal
  type: other
- description: Generates interactive HTML reports and architecture diagrams with embedded
    Cytoscape.js (report.py, diagram.py)
  id: html_renderer
  source_paths:
  - report.py
  - diagram.py
  - report_md.py
  technology: Python / HTML / JavaScript
  trust_boundary: internal
  type: service
- description: The authored .tmdd/ YAML threat model itself - the input every command
    parses, and the injection vector behind prompt_injection, glob_redos and the stored-XSS
    threats. Excludes generated artifacts under .tmdd/out/
  id: threat_model_store
  source_paths:
  - .tmdd/*.yaml
  - .tmdd/threats/*.yaml
  technology: YAML files on local filesystem
  trust_boundary: internal
  type: other
- description: 'Generated artifacts written by TMDD: consolidated .tm.yaml, prompt
    text files, HTML reports and diagrams (.tmdd/out/)'
  id: filesystem_store
  technology: Local filesystem
  trust_boundary: internal
  type: other
- description: External CDN (unpkg.com) serving Cytoscape.js 3.30.4, dagre 0.8.5,
    and cytoscape-dagre 2.5.0 loaded client-side in generated HTML
  id: cdn_libraries
  technology: unpkg.com CDN / JavaScript
  trust_boundary: external
  type: external
- description: External git executable invoked as a subprocess by the review command
    to list changed files (git diff --name-only). Not bundled with TMDD; resolved
    from PATH
  id: git_cli
  technology: git (external process via subprocess.run)
  trust_boundary: external
  type: external
data_flows:
- authentication: none
  data_description: CLI commands with arguments (path, feature name, description,
    template name, --base ref)
  destination: cli_core
  id: df_developer_to_cli
  protocol: stdin
  source: developer
- authentication: none
  data_description: 'Parsed argparse Namespace for init: target path, system name,
    description, template name'
  destination: init_engine
  id: df_cli_to_init
  protocol: function_call
  source: cli_core
- authentication: none
  data_description: 'Parsed argparse Namespace for lint: path to the .tmdd directory'
  destination: lint_engine
  id: df_cli_to_lint
  protocol: function_call
  source: cli_core
- authentication: none
  data_description: 'Parsed argparse Namespace for feature: feature name, description,
    model path'
  destination: feature_engine
  id: df_cli_to_feature
  protocol: function_call
  source: cli_core
- authentication: none
  data_description: 'Parsed argparse Namespace for compile: model path, optional feature
    filter'
  destination: compile_engine
  id: df_cli_to_compile
  protocol: function_call
  source: cli_core
- authentication: none
  data_description: 'Parsed argparse Namespace for review: model path, --base ref,
    --staged, --files, --repo-root, output format'
  destination: review_engine
  id: df_cli_to_review
  protocol: function_call
  source: cli_core
- authentication: none
  data_description: File paths to load; returns parsed YAML dicts for structural and
    cross-reference validation
  destination: yaml_processor
  id: df_lint_to_yaml
  protocol: function_call
  source: lint_engine
- authentication: none
  data_description: File paths to load; returns the parsed threat model used to build
    feature prompts
  destination: yaml_processor
  id: df_feature_to_yaml
  protocol: function_call
  source: feature_engine
- authentication: none
  data_description: File paths to load; returns the full parsed model for consolidation
    into .tm.yaml
  destination: yaml_processor
  id: df_compile_to_yaml
  protocol: function_call
  source: compile_engine
- authentication: none
  data_description: File paths to load, plus component source_paths globs translated
    to regexes for changed-file matching
  destination: yaml_processor
  id: df_review_to_yaml
  protocol: function_call
  source: review_engine
- authentication: none
  data_description: File paths to load; returns the parsed model rendered into HTML
    report and diagram output
  destination: yaml_processor
  id: df_html_to_yaml
  protocol: function_call
  source: html_renderer
- authentication: none
  data_description: Read authored .tmdd/ YAML files (system.yaml, actors.yaml, components.yaml,
    features.yaml, data_flows.yaml, threats/*.yaml) via yaml.safe_load()
  destination: threat_model_store
  id: df_yaml_to_model
  protocol: filesystem
  source: yaml_processor
- authentication: none
  data_description: Template YAML files with {{name}} and {{description}} placeholders
    substituted with user input, written to target directory
  destination: filesystem_store
  id: df_init_templates
  protocol: filesystem
  source: template_store
- authentication: none
  data_description: Loaded threat model dict and feature metadata for threat-modeling
    prompt generation
  destination: prompt_generator
  id: df_feature_to_prompts
  protocol: function_call
  source: feature_engine
- authentication: none
  data_description: Loaded threat model dict for secure-coding agent prompt generation
  destination: prompt_generator
  id: df_compile_to_prompts
  protocol: function_call
  source: compile_engine
- authentication: none
  data_description: Generated text prompt files (*.threatmodel.txt, *.prompt.txt)
    written to .tmdd/out/
  destination: filesystem_store
  id: df_prompts_to_filesystem
  protocol: filesystem
  source: prompt_generator
- authentication: none
  data_description: Standalone invocation of report.py / diagram.py with model path,
    output directory and output filename
  destination: html_renderer
  id: df_developer_to_html
  protocol: stdin
  source: developer
- authentication: none
  data_description: Generated HTML files (tm.html, diagram.html) with embedded JSON
    data and JavaScript, written to .tmdd/out/
  destination: filesystem_store
  id: df_html_to_filesystem
  protocol: filesystem
  source: html_renderer
- authentication: none
  data_description: git diff --name-only invocation carrying the user-provided --base
    ref/--repo-root; returns the list of changed file paths for the review command
  destination: git_cli
  id: df_review_to_git
  protocol: subprocess
  source: review_engine
- authentication: none
  data_description: JavaScript libraries (cytoscape.min.js, dagre.min.js, cytoscape-dagre.js)
    loaded via script tags from unpkg.com
  destination: report_viewer
  id: df_cdn_to_browser
  protocol: HTTPS
  source: cdn_libraries
- authentication: none
  data_description: HTML report/diagram files served to browser with embedded threat
    model data in JSON format
  destination: report_viewer
  id: df_filesystem_to_viewer
  protocol: filesystem
  source: filesystem_store
- authentication: none
  data_description: Generated prompt text files consumed by AI agent for threat modeling
    or secure code generation
  destination: ai_agent
  id: df_filesystem_to_agent
  protocol: filesystem
  source: filesystem_store
