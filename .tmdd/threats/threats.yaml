# =============================================================================
# Threat Catalog - Threats specific to the TMDD CLI codebase
# =============================================================================
# Each threat references specific components, endpoints, or files.
# =============================================================================

threats:
  yaml_template_injection:
    name: "YAML template injection via init command name/description"
    description: "In src/commands/init.py:36-39, user-provided --name and --description values are substituted into YAML templates using simple str.replace() without escaping YAML metacharacters. A name containing newlines or YAML syntax (e.g., colons, brackets) could produce malformed or structurally altered YAML output files."
    severity: low
    stride: T
    cwe: CWE-74
    suggested_mitigations: [yaml_escape_init_input]

  cdn_supply_chain_attack:
    name: "Supply chain attack via CDN JavaScript dependencies"
    description: "report.py and diagram.py embed <script> tags loading from unpkg.com (cytoscape@3.30.4, dagre@0.8.5, cytoscape-dagre@2.5.0). If unpkg.com is compromised, a package is hijacked, or a MITM attack occurs, malicious JavaScript would execute in the report viewer's browser with full DOM access to the threat model data."
    severity: high
    stride: T
    cwe: CWE-829
    suggested_mitigations: [sri_hashes_cdn, bundle_libs_locally]

  xss_stored_diagram:
    name: "Stored XSS via innerHTML in diagram JavaScript"
    description: "In report.py's _DIAGRAM_JS (line 572+), the showFeature() function builds HTML strings from threat model data (threat names, descriptions, goals) and injects them via innerHTML. Although data passes through JSON.parse from an embedded <script> tag, YAML values containing HTML (e.g., <img onerror=...>) would be rendered as active markup in the viewer's browser."
    severity: medium
    stride: T
    cwe: CWE-79
    suggested_mitigations: [replace_innerhtml_textcontent, js_html_escape_helper]

  xss_stored_node_info:
    name: "Stored XSS via innerHTML in node-info panel"
    description: "In report.py's _DIAGRAM_JS, the cy.on('tap') handler for nodes and edges builds HTML strings using d.label, d.description, d.technology, and d.flowId directly, injecting them via info.innerHTML without HTML encoding. Malicious content in YAML component descriptions would execute as JavaScript."
    severity: medium
    stride: T
    cwe: CWE-79
    suggested_mitigations: [replace_innerhtml_textcontent, js_html_escape_helper]


  no_audit_trail:
    name: "No audit trail for threat model modifications"
    description: "TMDD stores threat models as plain YAML files with no built-in change tracking, signing, or attribution. Anyone with filesystem access can modify threats, mitigations, or feature mappings without a trace, undermining the integrity of the security assessment."
    severity: medium
    stride: R
    cwe: CWE-778
    suggested_mitigations: [git_change_tracking]

  prompt_injection:
    name: "Prompt injection via threat model content in generated AI prompts"
    description: "In src/generators/agent_prompt.py and threat_prompt.py, threat model data (threat names, descriptions, mitigation text) is embedded directly into AI prompt text without sanitization. A malicious actor who can edit YAML files could inject adversarial instructions into the prompt that alter the AI agent's behavior."
    severity: medium
    stride: T
    cwe: CWE-77
    suggested_mitigations: [prompt_delimiters]

  json_script_breakout:
    name: "Script tag breakout in embedded JSON diagram data"
    description: "In report.py:114, _safe_json() escapes </ to <\\/ to prevent script tag breakout. However, other injection vectors (e.g., HTML entities, Unicode escapes) in threat model strings embedded in the <script type='application/json'> block could potentially bypass this single-pattern defense."
    severity: low
    stride: T
    cwe: CWE-79
    suggested_mitigations: [js_html_escape_helper, enhanced_safe_json]

  report_path_traversal:
    name: "Report output path traversal via --name parameter"
    description: "In report.py:1085, the --name argument is joined with the output directory via Path(out) / output_name without validation. Unlike diagram.py which uses safe_name() for filename generation (line 156), report.py passes the raw user input directly, allowing path traversal characters (e.g., ../../malicious.html) to write the HTML report outside the intended output directory."
    severity: low
    stride: T
    cwe: CWE-22
    suggested_mitigations: [validate_report_filename]

  glob_redos:
    name: "Regex denial of service via crafted component source_paths glob"
    description: "In src/utils.py:92-127, glob_to_regex() translates a component's source_paths glob into a regex, mapping each '**' to '.*'. A source_paths value crafted with many wildcard segments (e.g. '**a**a**a...') compiles to a regex with many chained '.*' groups that exhibits catastrophic/polynomial backtracking when matched against long non-matching paths during 'tmdd review' (path_matches_any, src/utils.py:135). An attacker able to edit components.yaml can hang the review command (denial of service), which is especially relevant when review runs in CI over an untrusted branch's threat model."
    severity: medium
    stride: D
    cwe: CWE-1333
    suggested_mitigations: [bound_glob_complexity]

  review_git_arg_injection:
    name: "Argument injection into git subprocess via --base ref"
    description: "In src/commands/review.py:57, the user-supplied --base value is interpolated into the git revision argument as f'{base}...HEAD' and passed to git diff via subprocess.run (no shell, args as a list). The trailing '...HEAD' concatenation prevents a crafted --base from forming a clean leading option, so classic argument injection is largely blocked, but the ref is still handed to git unvalidated. In a CI context that forwards an untrusted PR ref into --base, unexpected revision resolution or errors are possible. Residual risk is low given the current suffix concatenation."
    severity: low
    stride: T
    cwe: CWE-88
    suggested_mitigations: [validate_git_ref]

  mitigation_reference_path_escape:
    name: "Mitigation reference path escapes repo root during lint"
    description: "In src/commands/lint.py:131, the reference-resolution check evaluates (repo_root / ref['file']).exists() without confining the path. Because pathlib resolves an absolute right-hand side to itself and does not collapse '..', a mitigations.yaml reference with an absolute path or '../' sequences is checked outside repo_root. The lint output ('file not found' vs silent) then acts as an existence oracle for arbitrary filesystem paths. An insider editing mitigations.yaml could probe for the presence of files outside the project."
    severity: low
    stride: I
    cwe: CWE-22
    suggested_mitigations: [confine_reference_paths]
